<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightsport</title>
    <!-- Styles -->
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header-top">
      <div class="top-line">
        <div class="top-line__left">
          <a href="#" class="logo">
            <img src="./assets/images/logo.svg" alt="Логотип" />
          </a>
        </div>
        <div class="top-line__center">
          <nav class="top-mnu">
            <ul>
              <li>
                <a href="#" data-text="Каталог">Каталог</a>
              </li>
              <li>
                <a href="#" data-text="Доставка">Доставка</a>
              </li>
              <li>
                <a href="#" data-text="Магазины">Магазины</a>
              </li>
            </ul>
          </nav>
        </div>
        <div class="top-line__right">
          <div class="mnu-button">
            <button class="mnu-button__menu">
              <span></span>
              <span></span>
            </button>
            <div class="main-menu-background"></div>
            <div class="main-menu">
              <nav class="main-menu__inner">
                <ul>
                  <li>
                    <a href="#" data-text="Каталог">Каталог<span></span></a>
                  </li>
                  <li>
                    <a href="#" data-text="Доставка">Доставка<span></span></a>
                  </li>
                  <li>
                    <a href="#" data-text="Магазины">Магазины<span></span></a>
                  </li>
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- Accordion -->
    <div class="container">
      <section class="accordion">
        <div class="accordion__col">
          <div class="accordion__bg">
            <img
              src="./public/images/ready/1.jpg"
              alt="Спортсмен на беговой дорожке"
            />
          </div>
          <div class="accordion__start">Спорт</div>
          <div class="accordion__content">
            <div class="accordion__header">
              <h2>Спорт</h2>
            </div>
            <div class="accordion__description"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="./scripts/app.js" defer></script>
  </body>
</html>
